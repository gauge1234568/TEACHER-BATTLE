<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>TeacherBattle</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        .battle-container {
            max-width: 900px;
            margin: auto;
        }

        .player-area {
            border: 2px solid #555;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            background: #292929;
        }

        .player-area.active {
            border-color: #4caf50;
        }

        .stats {
            margin: 8px 0;
        }

        .bar {
            width: 100%;
            height: 22px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
            margin: 5px 0 10px;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.2s;
        }

        .hp-fill {
            background: #e53935;
        }

        .stamina-fill {
            background: #fbc02d;
        }

        .energy-fill {
            background: #2196f3;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 7px;
            background: #444;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover:not(:disabled) {
            background: #666;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .moves {
            margin-top: 15px;
        }

        .special {
            background: #8e24aa;
        }

        .special:hover:not(:disabled) {
            background: #ab47bc;
        }

        .switch {
            background: #1565c0;
        }

        .switch:hover:not(:disabled) {
            background: #1976d2;
        }

        .menu {
            display: none;
            border: 2px solid #777;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            background: #202020;
        }

        .menu h3 {
            margin-bottom: 10px;
        }

        .battle-log {
            background: #111;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            height: 220px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 6px;
        }

        .turn-display {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }

        .waiting {
            color: #aaa;
        }

        .error {
            color: #ff5252;
            font-weight: bold;
        }

        .book-button {
            background: #6a1b9a;
            width: calc(100% - 10px);
        }

        .book-button:hover:not(:disabled) {
            background: #8e24aa;
        }

        .close-button {
            background: #777;
        }

        .character-name {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="battle-container">

    <h1>TeacherBattle</h1>

    <div
        id="turnDisplay"
        class="turn-display"
    >
        Waiting for battle...
    </div>

    <!-- MY PLAYER -->
    <div
        id="myArea"
        class="player-area"
    >
        <h2>You</h2>

        <div
            id="myCharacter"
            class="character-name"
        >
            Loading...
        </div>

        <div class="stats">
            HP:
            <span id="myHpText">0 / 0</span>

            <div class="bar">
                <div
                    id="myHpBar"
                    class="bar-fill hp-fill"
                ></div>
            </div>

            Stamina:
            <span id="myStaminaText">0 / 0</span>

            <div class="bar">
                <div
                    id="myStaminaBar"
                    class="bar-fill stamina-fill"
                ></div>
            </div>

            Energy:
            <span id="myEnergyText">0 / 100</span>

            <div class="bar">
                <div
                    id="myEnergyBar"
                    class="bar-fill energy-fill"
                ></div>
            </div>
        </div>

        <div class="moves">
            <h3>Moves</h3>

            <div id="moveButtons"></div>

            <button
                id="specialButton"
                class="special"
                disabled
            >
                SPECIAL
            </button>

            <button
                id="switchButton"
                class="switch"
                disabled
            >
                SWITCH CHARACTER
            </button>
        </div>

        <!-- SWITCH MENU -->
        <div
            id="switchMenu"
            class="menu"
        >
            <h3>Choose a Character</h3>

            <button
                class="switchCharacter"
                data-index="0"
            >
                Character 1
            </button>

            <button
                class="switchCharacter"
                data-index="1"
            >
                Character 2
            </button>

            <button
                class="switchCharacter"
                data-index="2"
            >
                Character 3
            </button>

            <br>

            <button
                id="closeSwitch"
                class="close-button"
            >
                Cancel
            </button>
        </div>

        <!-- BOOK MENU -->
        <div
            id="bookMenu"
            class="menu"
        >
            <h3>Choose a Book</h3>

            <p>
                Choose a literature book for the special attack.
            </p>

            <div id="bookButtons"></div>

            <button
                id="closeBook"
                class="close-button"
            >
                Cancel
            </button>
        </div>
    </div>

    <!-- OPPONENT -->
    <div
        id="opponentArea"
        class="player-area"
    >
        <h2>Opponent</h2>

        <div
            id="opponentName"
            class="character-name"
        >
            Waiting...
        </div>

        <div class="stats">
            HP:
            <span id="opponentHpText">0 / 0</span>

            <div class="bar">
                <div
                    id="opponentHpBar"
                    class="bar-fill hp-fill"
                ></div>
            </div>

            Stamina:
            <span id="opponentStaminaText">0 / 0</span>

            <div class="bar">
                <div
                    id="opponentStaminaBar"
                    class="bar-fill stamina-fill"
                ></div>
            </div>

            Energy:
            <span id="opponentEnergyText">0 / 100</span>

            <div class="bar">
                <div
                    id="opponentEnergyBar"
                    class="bar-fill energy-fill"
                ></div>
            </div>
        </div>

        <div>
            <strong>Last Move:</strong>
            <span id="opponentLastMove">None</span>
        </div>
    </div>

    <!-- BATTLE LOG -->
    <div class="battle-log">
        <h3>Battle Log</h3>

        <div id="battleLog"></div>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const playerName =
    sessionStorage.getItem("playerName") ||
    localStorage.getItem("playerName");

const battleId =
    sessionStorage.getItem("battleId") ||
    localStorage.getItem("battleId");

if (!playerName) {
    console.error("No player name found.");
}

if (!battleId) {
    console.error("No battle ID found.");
}


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const turnDisplay =
    document.getElementById("turnDisplay");

const myCharacter =
    document.getElementById("myCharacter");

const myHpText =
    document.getElementById("myHpText");

const myStaminaText =
    document.getElementById("myStaminaText");

const myEnergyText =
    document.getElementById("myEnergyText");

const myHpBar =
    document.getElementById("myHpBar");

const myStaminaBar =
    document.getElementById("myStaminaBar");

const myEnergyBar =
    document.getElementById("myEnergyBar");

const opponentName =
    document.getElementById("opponentName");

const opponentHpText =
    document.getElementById("opponentHpText");

const opponentStaminaText =
    document.getElementById("opponentStaminaText");

const opponentEnergyText =
    document.getElementById("opponentEnergyText");

const opponentHpBar =
    document.getElementById("opponentHpBar");

const opponentStaminaBar =
    document.getElementById("opponentStaminaBar");

const opponentEnergyBar =
    document.getElementById("opponentEnergyBar");

const opponentLastMove =
    document.getElementById("opponentLastMove");

const moveButtons =
    document.getElementById("moveButtons");

const specialButton =
    document.getElementById("specialButton");

const switchButton =
    document.getElementById("switchButton");

const switchMenu =
    document.getElementById("switchMenu");

const bookMenu =
    document.getElementById("bookMenu");

const bookButtons =
    document.getElementById("bookButtons");

const closeSwitch =
    document.getElementById("closeSwitch");

const closeBook =
    document.getElementById("closeBook");

const battleLog =
    document.getElementById("battleLog");


// --------------------------------------------------
// CHARACTER MOVES
// --------------------------------------------------

function getMoves(character) {

    if (character === "Mr. Sannes") {

        return [
            {
                name: "VOICE CRACK",
                id: "voicecrack"
            },
            {
                name: "3 2 1 0",
                id: "3210"
            },
            {
                name: "4 QUARTERS",
                id: "4quarters"
            }
        ];

    }


    if (character === "Mr. Dutlinger") {

        return [
            {
                name: "MARINE BOOTCAMP",
                id: "marinebootcamp"
            },
            {
                name: "HOORAH",
                id: "hoorah"
            },
            {
                name: "MTN DEW CHUCK",
                id: "mtndewchuck"
            }
        ];

    }


    if (character === "Dr. Savic") {

        return [
            {
                name: "GUITAR SMASH",
                id: "guitarsmash"
            },
            {
                name: "MUSIC NOTES",
                id: "musicnotes"
            },
            {
                name: "MUSIC HISTORY DAY",
                id: "musichistoryday"
            }
        ];

    }


    if (character === "Mrs. Smauley") {

        return [
            {
                name: "RULER SMACK",
                id: "rulersmack"
            },
            {
                name: "BOOK MINIGUN",
                id: "bookminigun"
            },
            {
                name: "DETENTION",
                id: "detention"
            }
        ];

    }


    if (character === "Mrs. Aysien") {

        return [
            {
                name: "BURNING WHITE HOUSE",
                id: "burningwhitehouse"
            },
            {
                name: "GUERILLA WARFARE",
                id: "guerillawarfare"
            },
            {
                name: "WASHINGTON SPEECH",
                id: "washingtonspeech"
            }
        ];

    }


    if (character === "Mr. Smauley") {

        return [
            {
                name: "MAP DAY",
                id: "mapday"
            },
            {
                name: "AUGUSTUS CHARM",
                id: "augustuscharm"
            },
            {
                name: "BACKSTAB",
                id: "backstab"
            }
        ];

    }


    return [];
}


// --------------------------------------------------
// SPECIAL NAMES
// --------------------------------------------------

const specialNames = {

    "Mr. Sannes":
        "GOLDEN SANNES",

    "Mr. Dutlinger":
        "50 CAL. TURRET",

    "Dr. Savic":
        "MUSIC LISTENING TEST",

    "Mrs. Smauley":
        "LITERATURE BOOKS",

    "Mrs. Aysien":
        "PENCIL STAB",

    "Mr. Smauley":
        "BACKUP"
};


// --------------------------------------------------
// UPDATE MOVE BUTTONS
// --------------------------------------------------

function updateMoveButtons(
    character,
    myTurn
) {

    moveButtons.innerHTML = "";

    const moves =
        getMoves(character);

    moves.forEach(
        (move) => {

            const button =
                document.createElement("button");

            button.textContent =
                move.name;

            button.dataset.move =
                move.id;

            button.disabled =
                !myTurn;

            button.onclick =
                () => {

                    if (button.disabled) {
                        return;
                    }

                    sendMove(move.id);
                };

            moveButtons.appendChild(
                button
            );
        }
    );
}


// --------------------------------------------------
// SEND NORMAL MOVE
// --------------------------------------------------

function sendMove(move) {

    disableActions();

    socket.emit(
        "battleMove",
        {
            battleId: battleId,
            move: move
        }
    );
}


// --------------------------------------------------
// UPDATE SWITCH BUTTONS
// --------------------------------------------------

function updateSwitchButtons(
    battle,
    player
) {

    const buttons =
        document.querySelectorAll(
            ".switchCharacter"
        );

    buttons.forEach(
        (button) => {

            const index =
                Number(
                    button.dataset.index
                );

            if (
                !battle.teams[player] ||
                !battle.teams[player][index]
            ) {
                button.textContent =
                    "Empty";

                button.disabled =
                    true;

                return;
            }

            const character =
                battle.teams[player][index];

            button.textContent =
                character;

            const hp =
                battle.hp[player][index];

            const stamina =
                battle.stamina[player][index];

            button.disabled =
                hp <= 0 ||
                stamina <= 0 ||
                battle.active[player] === index;
        }
    );
}


// --------------------------------------------------
// UPDATE BAR
// --------------------------------------------------

function updateBar(
    element,
    current,
    maximum
) {

    if (
        !maximum ||
        maximum <= 0
    ) {

        element.style.width =
            "0%";

        return;
    }

    let percentage =
        (current / maximum) * 100;

    percentage =
        Math.max(
            0,
            Math.min(
                100,
                percentage
            )
        );

    element.style.width =
        percentage + "%";
}


// --------------------------------------------------
// FIND PLAYER INDEX
// --------------------------------------------------

function getMyIndex(battle) {

    if (
        !battle.names ||
        !Array.isArray(battle.names)
    ) {
        return -1;
    }

    return battle.names.indexOf(
        playerName
    );
}


// --------------------------------------------------
// UPDATE SCREEN
// --------------------------------------------------

function updateScreen(battle) {

    if (!battle) {
        return;
    }

    const myIndex =
        getMyIndex(battle);

    if (myIndex === -1) {
        return;
    }

    const names =
        battle.names;

    const opponentIndex =
        myIndex === 0
            ? 1
            : 0;

    const opponentPlayer =
        names[opponentIndex];

    if (!opponentPlayer) {

        turnDisplay.textContent =
            "Waiting for opponent...";

        return;
    }


    // --------------------------------------------------
    // MY ACTIVE CHARACTER
    // --------------------------------------------------

    const myActiveIndex =
        battle.active[playerName];

    const myCharacterName =
        battle.teams[playerName]
            [myActiveIndex];

    const myHp =
        battle.hp[playerName]
            [myActiveIndex];

    const myStamina =
        battle.stamina[playerName]
            [myActiveIndex];

    const myEnergy =
        battle.energy[playerName]
            [myActiveIndex];


    // --------------------------------------------------
    // OPPONENT ACTIVE CHARACTER
    // --------------------------------------------------

    const opponentActiveIndex =
        battle.active[opponentPlayer];

    const opponentCharacterName =
        battle.teams[opponentPlayer]
            [opponentActiveIndex];

    const opponentHp =
        battle.hp[opponentPlayer]
            [opponentActiveIndex];

    const opponentStamina =
        battle.stamina[opponentPlayer]
            [opponentActiveIndex];

    const opponentEnergy =
        battle.energy[opponentPlayer]
            [opponentActiveIndex];


    // --------------------------------------------------
    // DISPLAY MY STATS
    // --------------------------------------------------

    myCharacter.textContent =
        myCharacterName;

    myHpText.textContent =
        myHp +
        " / " +
        battle.maxHp[playerName]
            [myActiveIndex];

    myStaminaText.textContent =
        myStamina +
        " / " +
        battle.maxStamina[playerName]
            [myActiveIndex];

    myEnergyText.textContent =
        myEnergy +
        " / 100";


    updateBar(
        myHpBar,
        myHp,
        battle.maxHp[playerName]
            [myActiveIndex]
    );

    updateBar(
        myStaminaBar,
        myStamina,
        battle.maxStamina[playerName]
            [myActiveIndex]
    );

    updateBar(
        myEnergyBar,
        myEnergy,
        100
    );


    // --------------------------------------------------
    // DISPLAY OPPONENT STATS
    // --------------------------------------------------

    opponentName.textContent =
        opponentPlayer +
        " — " +
        opponentCharacterName;

    opponentHpText.textContent =
        opponentHp +
        " / " +
        battle.maxHp[opponentPlayer]
            [opponentActiveIndex];

    opponentStaminaText.textContent =
        opponentStamina +
        " / " +
        battle.maxStamina[opponentPlayer]
            [opponentActiveIndex];

    opponentEnergyText.textContent =
        opponentEnergy +
        " / 100";


    updateBar(
        opponentHpBar,
        opponentHp,
        battle.maxHp[opponentPlayer]
            [opponentActiveIndex]
    );

    updateBar(
        opponentStaminaBar,
        opponentStamina,
        battle.maxStamina[opponentPlayer]
            [opponentActiveIndex]
    );

    updateBar(
        opponentEnergyBar,
        opponentEnergy,
        100
    );


    // --------------------------------------------------
    // TURN
    // --------------------------------------------------

    const myTurn =
        battle.turn === playerName;


    if (battle.finished) {

        turnDisplay.textContent =
            "Battle Finished";

    } else if (myTurn) {

        turnDisplay.textContent =
            "YOUR TURN";

    } else {

        turnDisplay.textContent =
            "OPPONENT'S TURN";
    }


    // --------------------------------------------------
    // MOVE BUTTONS
    // --------------------------------------------------

    updateMoveButtons(
        myCharacterName,
        myTurn
    );


    // --------------------------------------------------
    // SPECIAL
    // --------------------------------------------------

    const waitingForBookChoice =
        battle.pendingBookChoice &&
        battle.pendingBookChoice[playerName];


    specialButton.textContent =
        "SPECIAL";

    specialButton.disabled =
        battle.finished ||
        !myTurn ||
        myEnergy < 100 ||
        waitingForBookChoice === true;


    // --------------------------------------------------
    // SWITCH
    // --------------------------------------------------

    switchButton.disabled =
        battle.finished;

    updateSwitchButtons(
        battle,
        playerName
    );


    // --------------------------------------------------
    // LAST MOVE
    // --------------------------------------------------

    if (
        battle.lastMove &&
        battle.lastMove[opponentPlayer]
    ) {

        opponentLastMove.textContent =
            battle.lastMove[
                opponentPlayer
            ];

    } else {

        opponentLastMove.textContent =
            "None";
    }


    // --------------------------------------------------
    // IF WAITING FOR BOOK CHOICE
    // --------------------------------------------------

    if (waitingForBookChoice) {

        turnDisplay.textContent =
            "CHOOSE A BOOK";

        specialButton.disabled =
            true;
    }
}


// --------------------------------------------------
// DISABLE ACTIONS
// --------------------------------------------------

function disableActions() {

    specialButton.disabled =
        true;

    switchButton.disabled =
        true;

    const buttons =
        moveButtons.querySelectorAll(
            "button"
        );

    buttons.forEach(
        (button) => {

            button.disabled =
                true;
        }
    );
}


// --------------------------------------------------
// SHOW ERROR
// --------------------------------------------------

function showError(message) {

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry error";

    entry.textContent =
        message;

    battleLog.appendChild(
        entry
    );

    battleLog.scrollTop =
        battleLog.scrollHeight;
}


// --------------------------------------------------
// BATTLE LOG
// --------------------------------------------------

function addLog(message) {

    const entry =
        document.createElement("div");

    entry.className =
        "log-entry";

    entry.textContent =
        message;

    battleLog.appendChild(
        entry
    );

    battleLog.scrollTop =
        battleLog.scrollHeight;
}


// --------------------------------------------------
// SPECIAL BUTTON
// --------------------------------------------------

specialButton.onclick =
    () => {

        if (
            specialButton.disabled
        ) {
            return;
        }

        disableActions();

        socket.emit(
            "specialMove",
            {
                battleId:
                    battleId
            }
        );
    };


// --------------------------------------------------
// SWITCH BUTTON
// --------------------------------------------------

switchButton.onclick =
    () => {

        if (
            switchButton.disabled
        ) {
            return;
        }

        bookMenu.style.display =
            "none";

        switchMenu.style.display =
            "block";
    };


// --------------------------------------------------
// CLOSE SWITCH MENU
// --------------------------------------------------

closeSwitch.onclick =
    () => {

        switchMenu.style.display =
            "none";
    };


// --------------------------------------------------
// SWITCH CHARACTERS
// --------------------------------------------------

document.querySelectorAll(
    ".switchCharacter"
).forEach(
    (button) => {

        button.onclick =
            () => {

                if (
                    button.disabled
                ) {
                    return;
                }

                const index =
                    Number(
                        button.dataset.index
                    );

                switchMenu.style.display =
                    "none";

                disableActions();

                socket.emit(
                    "switchCharacter",
                    {
                        battleId:
                            battleId,

                        index:
                            index
                    }
                );
            };
    }
);


// --------------------------------------------------
// CLOSE BOOK MENU
// --------------------------------------------------

closeBook.onclick =
    () => {

        bookMenu.style.display =
            "none";
    };


// --------------------------------------------------
// BOOK CHOICE
// --------------------------------------------------

socket.on(
    "bookChoice",
    (data) => {

        bookButtons.innerHTML = "";

        let books = [];

        if (
            data &&
            Array.isArray(data.books)
        ) {

            books =
                data.books;

        } else if (
            Array.isArray(data)
        ) {

            books =
                data;
        }


        if (books.length === 0) {

            showError(
                "No books were provided."
            );

            return;
        }


        books.forEach(
            (book) => {

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "book-button";

                button.textContent =
                    book;

                button.onclick =
                    () => {

                        bookMenu.style.display =
                            "none";

                        disableActions();

                        socket.emit(
                            "bookChoice",
                            {
                                battleId:
                                    battleId,

                                book:
                                    book
                            }
                        );
                    };

                bookButtons.appendChild(
                    button
                );
            }
        );


        switchMenu.style.display =
            "none";

        bookMenu.style.display =
            "block";
    }
);


// --------------------------------------------------
// BATTLE UPDATE
// --------------------------------------------------

socket.on(
    "battleUpdate",
    (battle) => {

        updateScreen(
            battle
        );
    }
);


// --------------------------------------------------
// BATTLE ACTION / LOG
// --------------------------------------------------

socket.on(
    "battleAction",
    (message) => {

        addLog(
            message
        );
    }
);


// --------------------------------------------------
// BATTLE ERROR
// --------------------------------------------------

socket.on(
    "battleError",
    (message) => {

        showError(
            message
        );

        // Let the next battleUpdate
        // restore the correct buttons.
    }
);


// --------------------------------------------------
// BATTLE FINISHED
// --------------------------------------------------

socket.on(
    "battleFinished",
    (data) => {

        if (
            data &&
            data.message
        ) {

            addLog(
                data.message
            );

        } else {

            addLog(
                "Battle finished!"
            );
        }

        disableActions();

        switchButton.disabled =
            true;
    }
);


// --------------------------------------------------
// CONNECTION
// --------------------------------------------------

socket.on(
    "connect",
    () => {

        console.log(
            "Connected to server:",
            socket.id
        );

        socket.emit(
            "joinBattle",
            {
                battleId:
                    battleId,

                playerName:
                    playerName
            }
        );
    }
);


socket.on(
    "disconnect",
    () => {

        turnDisplay.textContent =
            "Disconnected from server.";
    }
);


// --------------------------------------------------
// INITIAL MESSAGE
// --------------------------------------------------

if (!playerName) {

    addLog(
        "ERROR: Player name was not found."
    );
}

if (!battleId) {
